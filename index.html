<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Viral</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Background atau placeholder visual */
    .bg-placeholder {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #222 0%, #000 100%);
    }

    /* Styling Tombol Play Besar di Tengah */
    .play-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .play-btn {
      background: #ff3c5f;
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 60, 95, 0.6);
      transition: transform 0.2s;
    }

    .play-btn:hover {
      transform: scale(1.05);
    }

    /* Popup Styles Berkala */
    .popup-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    .popup-box {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      animation: slideUp 0.3s ease-in-out;
    }

    .popup-box h2 {
      margin-top: 0;
      font-size: 20px;
      color: #333;
    }

    .popup-box p {
      font-size: 15px;
      color: #555;
      margin: 16px 0;
    }

    .popup-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .popup-buttons button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .popup-buttons button:first-child {
      background: #e0e0e0;
      color: #333;
    }

    .popup-buttons button:last-child {
      background: #ff3c5f;
      color: #fff;
    }

    .popup-buttons button:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="bg-placeholder"></div>
</div>

<!-- Tombol Play Pertama (Direct Link ke Videy.co) -->
<div id="play-overlay" class="play-overlay">
  <button class="play-btn" onclick="initPlay()">PLAY VIDEO</button>
</div>

<!-- Popup Overlay Konfirmasi Usia Berkala -->
<div id="popup-overlay" class="popup-overlay">
  <div class="popup-box">
    <h2>Konfirmasi Usia</h2>
    <p>Video ini mengandung konten dewasa. Apakah Anda berusia di atas 18 tahun dan ingin melanjutkan?</p>
    <div class="popup-buttons">
      <button onclick="handleAdRedirect()">BATAL</button>
      <button onclick="handleAdRedirect()">LANJUT</button>
    </div>
  </div>
</div>

<script>
  // Link Adsterra Smartlink Anda
  const adsterraURL = 'https://www.profitableratecpmnetwork.com/hh55phupz7?key=035891703dff41ba6e0911050a5989af';
  
  // Link Video Videy.co tujuan awal
  const videyURL = 'https://videy.co/v/?id=r6JCvQxd1';

  const popup = document.getElementById("popup-overlay");
  const playOverlay = document.getElementById("play-overlay");
  let timer = null;

  // Fungsi untuk memicu kemunculan popup konfirmasi berulang setiap 5 detik
  function startPopupLoop() {
    clearTimeout(timer);
    timer = setTimeout(function() {
      popup.style.display = "flex";
    }, 5000); // Muncul setiap 5 detik
  }

  // Ketika tombol PLAY VIDEO pertama kali diklik
  function initPlay() {
    // Buka video videy.co di tab baru
    window.open(videyURL, '_blank');
    
    // Sembunyikan tombol play awal di halaman kita
    playOverlay.style.display = 'none';

    // Mulai hitung mundur 5 detik untuk memunculkan popup konfirmasi usia pertama
    startPopupLoop();
  }

  // Ketika tombol BATAL atau LANJUT pada popup diklik
  function handleAdRedirect() {
    // Buka iklan Adsterra Smartlink di tab baru
    window.open(adsterraURL, '_blank');

    // Sembunyikan popup saat ini
    popup.style.display = 'none';

    // Jalankan timer kembali agar popup bisa muncul lagi setelah 5 detik berikutnya
    startPopupLoop();
  }
</script>

</body>
</html>
