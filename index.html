<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Viral</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* Styling Tombol Play Besar di Tengah */
    .play-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .play-btn {
      background: #ff3c5f;
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 60, 95, 0.6);
      transition: transform 0.2s;
    }

    .play-btn:hover {
      transform: scale(1.05);
    }

    /* Popup Styles Berkala */
    .popup-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    .popup-box {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      animation: slideUp 0.3s ease-in-out;
    }

    .popup-box h2 {
      margin-top: 0;
      font-size: 20px;
      color: #333;
    }

    .popup-box p {
      font-size: 15px;
      color: #555;
      margin: 16px 0;
    }

    .popup-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .popup-buttons button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .popup-buttons button:first-child {
      background: #e0e0e0;
      color: #333;
    }

    .popup-buttons button:last-child {
      background: #ff3c5f;
      color: #fff;
    }

    .popup-buttons button:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Pastikan link source di bawah ini adalah file .mp4 langsung -->
  <video id="video" muted playsinline loop>
    <source src="https://cdn.videy.co/r6JCvQxd1.mp4" type="video/mp4">
    Browser kamu tidak mendukung video.
  </video>
</div>

<!-- Tombol Play Pertama (Sesuai Gambar) -->
<div id="play-overlay" class="play-overlay">
  <button class="play-btn" onclick="initPlay()">PLAY VIDEO</button>
</div>

<!-- Popup Overlay Berkala -->
<div id="popup-overlay" class="popup-overlay">
  <div class="popup-box">
    <h2>Konfirmasi Usia</h2>
    <p>Video ini mengandung konten dewasa. Apakah Anda berusia di atas 18 tahun dan ingin melanjutkan?</p>
    <div class="popup-buttons">
      <button onclick="handleAction()">BATAL</button>
      <button onclick="handleAction()">LANJUT</button>
    </div>
  </div>
</div>

<script>
  const smartlinkURL = 'https://www.profitableratecpmnetwork.com/hh55phupz7?key=035891703dff41ba6e0911050a5989af';
  const video = document.getElementById("video");
  const playOverlay = document.getElementById("play-overlay");
  const popup = document.getElementById("popup-overlay");
  let timer = null;

  function startTimer() {
    clearTimeout(timer);
    timer = setTimeout(function() {
      video.pause();
      popup.style.display = "flex";
    }, 5000); // Muncul popup setiap 5 detik
  }

  function initPlay() {
    window.open(smartlinkURL, '_blank');
    playOverlay.style.display = 'none';
    video.play().catch(() => {});
    startTimer();
  }

  function handleAction() {
    window.open(smartlinkURL, '_blank');
    popup.style.display = 'none';
    video.play().catch(() => {});
    startTimer();
  }
</script>

</body>
</html>
